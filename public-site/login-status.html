<!doctype html>
<html lang="th">
<head>

  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;background:radial-gradient(circle at 72% 20%,rgba(55,199,230,.14),transparent 28%),linear-gradient(145deg,#070d19,#101d34);font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;line-height:1.65}.card{width:min(100%,680px);padding:clamp(28px,6vw,58px);border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.065);box-shadow:0 35px 100px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.mark{width:54px;aspect-ratio:1;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#2e62f2,#37c7e6);font:800 25px Arial}.label{margin:30px 0 10px;color:#79dcef;font:700 12px Arial;letter-spacing:2px}.card h1{margin:0;font-size:clamp(32px,7vw,52px);line-height:1.15}.card p{color:#bdc8d9;font-size:17px}.notice{margin:28px 0;padding:18px 20px;border-left:3px solid #37c7e6;border-radius:0 13px 13px 0;background:rgba(55,199,230,.075);color:#dce8f5}.actions{display:flex;flex-wrap:wrap;gap:10px}.button{min-height:50px;display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border-radius:999px;color:#fff;background:#2e62f2;text-decoration:none;font-weight:700}.button.secondary{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07)}@media(max-width:520px){.actions{display:grid}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">N</div>

    <p>ขณะนี้เว็บไซต์เปิดให้ดูข้อมูลบริการและติดต่อบริษัทได้ตามปกติ แต่ระบบ Login สำหรับลูกค้ายังไม่เปิดใช้งานจริง</p>

    <div class="actions">
      <a class="button" href="index.html">กลับหน้าเว็บไซต์</a>
      <a class="button secondary" href="tel:0631941191">โทร 063-194-1191</a>
