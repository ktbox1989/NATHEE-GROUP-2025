name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: bash scripts/verify-public-site.sh
      - run: bash scripts/test-public-site-gate.sh
      - run: bash scripts/test-public-seo-gates.sh
      - run: bash scripts/test-deploy-file-tools.sh
